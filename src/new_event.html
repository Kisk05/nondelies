<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規イベント登録画面</title>
</head>
<body>
    <label for="sup_id">スーパー選択:</label>
    <select id="sup_id" required">
        <option value="">ロード中...</option>
    </select>
    <br>
    <!--
    <label for="event_type">イベント選択:</label>
    <select id="event_type" required>
        <option value="sale">セール</option>
        <option value="fes">祭り</option>
        <option value="holiday">店休日</option>
    </select>
    <br> 
    -->
    <label for="repeat_type">繰り返し周期:</label>
    <select id="repeat_type" required>
        <option value="">繰り返しの周期を選択</option>
        <option value="weekly">1週間</option>
        <option value="monthly">1か月</option>
        <option value="yearly">1年</option>
        <option value="one">単発</option>
    </select>
    <br><br>
    <label for="repeat_dayofweek">毎週恒例の開催曜日:</label>
    <select id="repeat_dayofweek">
        <option value=-1>曜日を選択</option>
        <option value=0>日</option>
        <option value=1>月</option>
        <option value=2>火</option>
        <option value=3>水</option>
        <option value=4>木</option>
        <option value=5>金</option>
        <option value=6>土</option>
    </select>
    <br>
    <label for="repeat_monthday">毎月恒例の開催日:</label>
    <input type="number" id="repeat_monthday" min=1 max=31>日
    <br>
    <label for="repeat_yearday">毎年恒例の開催日:</label>
    <input type="number" id="month" min=1 max=12>月
    <input type="number" id="day" min=1 max=31>日
    <br>
    <label for="repeat_oneday">単発の開催日:</label>
    <input type="date" id="repeat_oneday">
    <br>
    <h3>セール情報</h3>
    <fieldset id="sale_group">
        <label for="sale_pro">お得商品:</label>
        <input type="text" id="sale_pro" required>
        <br>
        <label for="sale_disc">割引率:</label>
        <input type="number" id="sale_disc" min=0 max=100 required>
        <br>
        <label for="sale_info">お得情報:</label>
        <input type="text" id="sale_info">
        <br>
        <button onclick="fetchnewsale()">セール情報登録</button>
        <div id="s_output"></div>
    </fieldset>
    <br>
    <h3>祭り情報</h3>
    <fieldset id="fes_group">
        <label for="fes_name">名前:</label>
        <input type="text" id="fes_name" required>
        <br>
        <label for="fes_info">詳細情報:</label>
        <input type="text" id="fes_info">
        <br>
        <button onclick="fetchnewfes()">祭り情報登録</button>
        <div id="f_output"></div>
    </fieldset>
    <br>
    <h3>店休日情報</h3>
    <fieldset id="hol_group">
        <label for="hol_name">休み名:</label>
        <input type="text" id="hol_name" required>
        <br>
        <label for="hol_info">詳細情報:</label>
        <input type="text" id="hol_info">
        <br>
        <button onclick="fetchnewholiday()">店休日情報登録</button>
        <div id="h_output"></div>
    </fieldset>
    <br>

    <script src="new_event.js?v=4"></script>
</body>
</html>
