<html lang="ja">

        <title>近くのスーパー検索</title>

        <button onclick="findsuper()">探す</button>

            <option value="">ロード中...</option>
        </select>
        <br>
        <div id="output"></div>

        <script src="/js/load_storesuper_info.js?v=1"></script>
        <script src="/js/get_nearsuper.js?v=1"></script>
    </body>
