<html lang="ja">
<head>

    <title>ユーザー登録画面</title>
</head>
<body>

    <input type="text" id="user_name" required>

    <br>
    <button onclick="fetchchecknewuser()">ユーザー登録</button>
    <div id="output"></div>

    <script src="/js/-user.js?v=0"></script>
</body>
</html>
