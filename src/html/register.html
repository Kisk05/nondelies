<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アカウント作成</title>
    <style>
        body {
            background-color: #fff6c9;
            font-family: "メイリオ", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ff3c3c;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #fff;
            border: 2px solid #ff3c3c;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 60, 60, 0.2);
        }

        h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.95em;
            color: #333;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #ff3c3c;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            margin-top: 5px;
            border: 2px solid #ff3c3c;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            user-select: none;
        }

        .toggle-eye:hover {
            color: #ff3c3c;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            background-color: #ff3c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #cc2e2e;
        }

        #output {
            margin-top: 20px;
            text-align: center;
            color: #ff3c3c;
        }
    </style>
</head>
<body>
    <header>スパ得！</header>
    <div class="container">
        <h2>アカウント作成</h2>

        <label for="new_email">メールアドレス</label>
        <input type="email" id="new_email" required>

        <label for="new_passwd">パスワード</label>
        <div class="password-wrapper">
            <input type="password" id="new_passwd" required>
            <span class="toggle-eye" id="eye1" onclick="togglePassword('new_passwd', 'eye1')">👁️</span>
        </div>

        <label for="confirm_passwd">パスワード（再入力）</label>
        <div class="password-wrapper">
            <input type="password" id="confirm_passwd" required>
            <span class="toggle-eye" id="eye2" onclick="togglePassword('confirm_passwd', 'eye2')">👁️</span>
        </div>

        <button onclick="register()">アカウントを作成</button>

        <div id="output"></div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🙈";
            } else {
                input.type = "password";
                icon.textContent = "👁️";
            }
        }

        function register() {
            const email = document.getElementById('new_email').value.trim();
            const passwd = document.getElementById('new_passwd').value.trim();
            const confirm = document.getElementById('confirm_passwd').value.trim();
            const output = document.getElementById('output');

            output.textContent = '処理中...';

            if (!email || !passwd || !confirm) {
                output.textContent = 'すべての項目を入力してください';
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                output.textContent = '正しいメールアドレスを入力してください';
                return;
            }

            if (passwd !== confirm) {
                output.textContent = 'パスワードが一致しません';
                return;
            }

            const apiURL = `/php/-register_user.php?user_email=${encodeURIComponent(email)}&user_passwd=${encodeURIComponent(passwd)}`;

            fetch(apiURL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTPエラー ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    output.textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    output.textContent = `エラー: ${error.message}\nPHPファイルまたはDB接続を確認してください。`;
                    console.error(error);
                });
        }
    </script>
</body>
</html>
