<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン画面</title>
    <style>
        body {
            background-color: #fff6c9;
            font-family: "メイリオ", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ff3c3c;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #fff;
            border: 2px solid #ff3c3c;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 60, 60, 0.2);
        }

        h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.95em;
            color: #333;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #ff3c3c;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 10px;
            padding-right: 40px; /* アイコン分の余白 */
            margin-top: 5px;
            border: 2px solid #ff3c3c;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            user-select: none; /* 選択不可にする */
        }


        .toggle-eye:hover {
            color: #ff3c3c;
        }

        .link {
            display: block;
            margin-top: 10px;
            font-size: 0.85em;
            color: #1a73e8;
            text-decoration: none;
            text-align: right;
        }

        .link:hover {
            text-decoration: underline;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #ff3c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #cc2e2e;
        }

        .secondary-btn {
            background-color: #fff;
            color: #ff3c3c;
            border: 2px solid #ff3c3c;
            margin-top: 10px;
            font-weight: bold;
        }

        .secondary-btn:hover {
            background-color: #ffeaea;
        }

        #output {
            margin-top: 20px;
            text-align: center;
            color: #ff3c3c;
        }
    </style>
</head>
<body>
    <header>スパ得！</header>
    <div class="container">
        <h2>ログイン</h2>

        <label for="user_email">メールアドレス</label>
        <input type="email" id="user_email" required>

        <label for="user_passwd">パスワード</label>
        <div class="password-wrapper">
            <input type="password" id="user_passwd" required>
            <span class="toggle-eye" id="eyeIcon" onclick="togglePassword()">👁️</span>
        </div>

        <a href="#" class="link">パスワードをお忘れですか？</a>

        <button onclick="login()">続ける</button>
        <button class="secondary-btn" onclick="location.href='register.html'">アカウントの作成</button>

        <div id="output"></div>
    </div>
    <script src="/js/login.js?v=2"></script>
</body>
</html>
