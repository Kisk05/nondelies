<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン画面</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #fff;
            border: 2px solid #d60000;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 60, 60, 0.2);
        }

        h2 {
            font-size: 1.5em;
            color: #d60000;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.95em;
            color: #333;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #d60000;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            margin-top: 5px;
            border: 2px solid #d60000;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .toggle-eye {
            position: absolute;
            width: auto;
            top: auto;
            right: 10px;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: right;
        }
        .toggle-eye:hover {
            background-color: transparent;
            transform: scale(1.12);
        }
        .toggle-eye:hover #eyeIcon {
            filter: brightness(0) saturate(100%) invert(30%) sepia(80%) saturate(2000%) hue-rotate(330deg);
        }

        .link {
            display: block;
            margin-top: 10px;
            font-size: 0.85em;
            color: #1a73e8;
            text-decoration: none;
            text-align: right;
        }

        .link:hover {
            text-decoration: underline;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #d60000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #d60000;
        }

        .secondary-btn {
            background-color: #fff;
            color: #d60000;
            border: 2px solid #d60000;
            margin-top: 10px;
            font-weight: bold;
        }

        .secondary-btn:hover {
            background-color: #ffeaea;
        }

        #output {
            margin-top: 20px;
            text-align: center;
            color: #d60000;
        }
    </style>
    <link rel="stylesheet" href="header.css">
</head>

<body>
    <div class="header">
        <div class="logo">スパ得</div>
        <div class="header-right">
            <a href="title.html">トップ</a>
            <a href="login.html" class="login-btn" id="login-btn">ログイン</a>
        </div>
    </div>
    <div class="container">
        <h2>ログイン</h2>

        <label for="user_email">メールアドレス</label>
        <input type="email" id="user_email" required>

        <label for="user_passwd">パスワード</label>
        <div class="password-wrapper">
            <input type="password" id="user_passwd" required>
            <button type="button" class="toggle-eye" id="eyeBtn" data-open="/add/eye_open.php" data-close="/add/eye_close.php" aria-pressed="false" aria-label="パスワードを表示" onclick="togglePassword()">
                <img id="eyeIcon" src="/add/eye_open.php" alt="目アイコン" width="20" height="20">
            </button>
        </div>

        <a href="fool.html" class="link">パスワードをお忘れですか？</a>

        <button onclick="login()">続ける</button>
        <button class="secondary-btn" onclick="location.href='register.html'">アカウントの作成</button>

        <div id="output"></div>
    </div>
    <script src="/js/login.js?v=2"></script>
</body>

</html>
