<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スパ得 - タイトル画面</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <style>
        /*お得情報ボタンエリア*/
        .nav-area {
            text-align: center;
            margin: 20px 0;
        }

        .nav-btn {
            background: transparent;
            color: #d60000;
            border: 4px solid #d60000;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
            margin: 0 10px;
            transition: 0.1s;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            background-color: #ff0;
        }
        .nav-btn.active {
            color: #fff; /* 文字色を白に */
            background-color: #d60000; /* 背景色を赤に */
            border-color: #d60000; /* 枠線を赤に */
            pointer-events: none; /* クリックを無効化（既に選択されているため） */
        }
        .section-title {
            text-align: center;
            font-size: 30px;
            background: linear-gradient(transparent 60%, #ff0 60%);
            display: inline-block;
            margin: 0 auto 20px;
        }

        .main-container {
            text-align: center;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border: 3px solid #d60000;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        /*スーパー表示エリア*/
        .store-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        /*スーパーのカード*/
        .card {
            width: 280px;
            background: white;
            border: 4px solid #d60000;
            padding: 10px;
            position: relative;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.2);
            transform: rotate(-2deg);
            transition: 0.5s;
            margin: 10px;
        }

        .card:nth-child(even) {
            transform: rotate(2deg);
            border-color: #0000cd;
            color: #0000cd;
        }
        .card:hover {
            transform: translateY(-5px);
            background-color: #e7e7e7;
        }



        .card-img {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #ccc;
            margin-bottom: 5px;
        }

        .card-img img {
            max-width: 90%;
        }

        .card-name {
            font-size: 22px;
            font-weight: 900;
        }

        /*スーパーを探す*/
        .postcode{
            width: 100%; 
            padding: 8px; 
            margin-bottom: 10px;
            border-radius: 10px;
        }
        .btn_find{
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #d60000; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
        }
        .result{
            padding: 10px;
            margin-top: 15px;
        }

        /* 近くのスーパー結果カードのスタイル */
        .nearsuper_card {
            background-color: #ffe082;
            border: 2px solid #d60000;
            border-radius: 8px;
            margin: 10px 0;
            padding: 15px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nearsuper_card:hover {
            background-color: #ffd700; /* ホバーで少し濃く */
            transform: scale(1.1);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .nearsuper_card .card_name {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }

        .nearsuper_card .card_distance {
            font-size: 0.9em;
            color: #0000cd; /* 青 */
            margin-top: 5px;
        }
        
        .nearsuper_card .card_action {
            font-size: 0.8em;
            color: #d60000; /* 赤 */
            margin-top: 5px;
            font-style: italic;
        }
        /*カレンダー*/
        .container .week_calender{
            border: 2px solid #ccc; 
            padding: 15px; 
            background-color: #f9f9f9; 
            margin-top: 20px; 
            font-size: 0.9em;
        }
        .container .daydata{
            color: #000;
            padding: 5px;
            border: 1px solid transparent;
            background-color: transparent;
        }
        .container .daydata:hover{
            background-color: #f2fcd7;
            cursor: pointer;
        }
        .container .daydata.today {
            padding: 5px;
            color: #00d615;
            background-color: #ffedb7;
            border: 1px solid transparent;
            font-weight: bold;
        }
        .container .daydata.today:hover{
            background-color: #f7edd0;
            border: 1px solid #ffdf5d;
            cursor: pointer;
        }

        .sale-day,
        .fes-day {
            background-color: #81c784;
            font-weight: bold;
            color: #000;
        }

        .holiday {
            background-color: #ff9d9d;
        }
    </style>
    <link rel="stylesheet" href="header.css?v=1">
</head>

<body>
    <div class="header">
        <div class="logo">スパ得</div>
        <div class="header-right">
            <a href="title.html">トップ</a>
            <a href="login.html" class="login-btn" id="login-btn">ログイン</a>
        </div>
    </div>

    <div class="nav-area">
        <div class="nav-btn active" onclick="showTokubi(event,true)">お特日メニュー</div>
        <a href="#" class="nav-btn" onclick="showCalendar(event)">カレンダーメニュー</a>
        <a href="#" class="nav-btn" onclick="findSuper(event)">お気に入りスーパーメニュー</a>
    </div>

    <div class="container"></div>

    <div class="main-container">
        <h2 class="section-title">提携スーパー一覧</h2>

        <div class="store-grid">
            <!-- 店舗1 -->
            <div class="card">
                <div class="card-img"><img src="/add/maruhachi.png" alt="画像" width="100px" height="100px"></div>
                <div class="card-name">スーパーマルハチ</div>
            </div>
            <!-- 店舗2 -->
            <div class="card">
                <div class="card-img"><img src="maxvalu.jpg" alt="画像"></div>
                <div class="card-name">マックスバリュ</div>
            </div>
            <!-- 店舗3 -->
            <div class="card">
                <div class="card-img"><img src="/add/gyomusuper.png" alt="画像"></div>
                <div class="card-name">業務スーパー</div>
            </div>
            <!-- 店舗4 -->
            <div class="card">
                <div class="card-img"><img src="coop.jpg" alt="画像"></div>
                <div class="card-name">コープこうべ</div>
            </div>
            <!-- 店舗5 -->
            <div class="card">
                <div class="card-img"><img src="maruai.jpg" alt="画像"></div>
                <div class="card-name">マルアイ</div>
            </div>
            <!-- 店舗6 -->
            <div class="card">
                <div class="card-img"><img src="kansai.jpg" alt="画像"></div>
                <div class="card-name">関西スーパー</div>
            </div>
        </div>
    </div>
    <script src="/js/load_storesuper_info.js?v=1"></script>
    <script src="/js/get_nearsuper.js?v=2"></script>
    <script src="/js/title.js?v=1"></script>
</body>

</html>
